{% extends "base.html" %}
{% block title %}Donate food — Anndaan{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<section class="form-page">
  <h1>Post a food donation</h1>
  <p class="form-sub">Posting as <strong>{{ current_user['name'] }}</strong> ({{ current_user['phone'] }}). Give NGOs enough detail to decide fast — what it is, how much, and how long it'll stay good.</p>

  <form method="post" class="form">
    <div class="map-container" style="margin-bottom: 1rem;">
      <label style="margin-bottom: 6px; display: block; font-weight: 600;">
        Pin pickup location on map <span style="font-weight: normal; color: #64748b; font-size: 0.85em;">(optional — click map to set pin)</span>
      </label>
      <div id="map" style="height: 260px; border-radius: 8px; border: 1px solid #e0e0d8; overflow: hidden;"></div>
      <input type="hidden" name="latitude" id="latitude" value="{{ form.get('latitude', '') }}">
      <input type="hidden" name="longitude" id="longitude" value="{{ form.get('longitude', '') }}">
    </div>

    <label>
      Food item(s)
      <input type="text" name="food_item" placeholder="e.g. Rice, dal, mixed vegetable curry" value="{{ form.get('food_item','') }}" required>
    </label>

    <div class="form-row">
      <label>
        Type
        <select name="food_type" required>
          <option value="">Select</option>
          <option value="veg" {% if form.get('food_type')=='veg' %}selected{% endif %}>Vegetarian</option>
          <option value="non-veg" {% if form.get('food_type')=='non-veg' %}selected{% endif %}>Non-vegetarian</option>
        </select>
      </label>

      <label>
        Quantity
        <input type="text" name="quantity" placeholder="e.g. serves 20 people" value="{{ form.get('quantity','') }}" required>
      </label>
    </div>

    <label>
      Pickup address
      <input type="text" name="pickup_address" placeholder="Full address or landmark" value="{{ form.get('pickup_address','') }}" required>
    </label>

    <label>
      Pick up by
      <input type="datetime-local" name="expiry_time" value="{{ form.get('expiry_time', default_expiry) }}" required>
    </label>

    <label>
      Notes (optional)
      <textarea name="notes" rows="3" placeholder="Packed in containers, ready from 7pm, ring the bell etc.">{{ form.get('notes','') }}</textarea>
    </label>

    <button type="submit" class="btn btn-primary">Post donation</button>
  </form>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const latInput = document.getElementById('latitude');
    const lngInput = document.getElementById('longitude');
    
    // Default Nagpur center or initial values
    const initLat = parseFloat(latInput.value) || 21.1458;
    const initLng = parseFloat(lngInput.value) || 79.0882;
    const initZoom = latInput.value ? 14 : 11;

    const map = L.map('map').setView([initLat, initLng], initZoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let marker = null;
    if (latInput.value && lngInput.value) {
      marker = L.marker([initLat, initLng]).addTo(map);
    }

    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);
      latInput.value = lat;
      lngInput.value = lng;
      if (marker) {
        marker.setLatLng(e.latlng);
      } else {
        marker = L.marker(e.latlng).addTo(map);
      }
    });

    setTimeout(function() { map.invalidateSize(); }, 200);
  });
</script>
{% endblock %}
